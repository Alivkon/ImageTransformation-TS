User tinyproxy
Group tinyproxy

# Gateway сети n8n_default на новом сервере. Публичный интерфейс прокси не слушает.
Port 8888
Listen 172.18.0.1

Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Connect
PidFile "/run/tinyproxy/tinyproxy.pid"

MaxClients 100
StartServers 2
MinSpareServers 2
MaxSpareServers 5

Allow 127.0.0.1
Allow 172.18.0.0/16

ConnectPort 443

