services:
  postgres:
    image: postgres:16-alpine
    container_name: postgre_imagetransformer_ts
    restart: unless-stopped
    env_file: .env
    # Те же значения, что в docker-compose.local.yml, — чтобы локальная и серверная
    # базы отличались только паролем. Применяются только при первой инициализации тома.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: imagetransformer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу не публикуется: бот ходит к базе по внутренней сети. Раскомментируй,
    # если нужен доступ с хоста (psql, дампы).
    # ports:
    #   - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imagetransformer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imagetransformer_net

  bot:
    build: .
    image: imagetransformationtgbot-ts
    container_name: imagetransformationtgbot_ts
    restart: unless-stopped
    env_file: .env
    environment:
      # Переопределяем DATABASE_URL из .env: внутри сети база доступна по имени сервиса
      # postgres — это контейнер из этого же compose, а не внешний.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/imagetransformer
      # Docker NAT нового провайдера не устанавливает соединение с Telegram.
      # Tinyproxy слушает только gateway общей внутренней Docker-сети.
      TELEGRAM_PROXY_URL: http://172.18.0.1:8888
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - imagetransformer_net
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.imagetransformation.rule=Host(`imagetransformation.ru`)"
      - "traefik.http.routers.imagetransformation.entrypoints=websecure"
      - "traefik.http.routers.imagetransformation.tls=true"
      - "traefik.http.routers.imagetransformation.tls.certresolver=mytlschallenge"
      - "traefik.http.services.imagetransformation.loadbalancer.server.port=8080"

volumes:
  postgres_data:
    driver: local

networks:
  imagetransformer_net:
    name: imgtransform_net
  n8n_default:
    external: true
