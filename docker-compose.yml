services:
  postgre_imagetransformer:
    image: postgres:16-alpine
    container_name: postgre_imagetransformer_ts
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: imagetransformer
      POSTGRES_USER: imagetransformer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Закомментируй для доступа только внутри сети
    ports:
      - "5434:5432"
    networks:
      - imagetransformer_net

  bot:
    build: .
    image: imagetransformationtgbot-ts
    container_name: imagetransformationtgbot_ts
    restart: unless-stopped
    env_file: .env
    environment:
      # Переопределяем DATABASE_URL внутри контейнера — используем имя сервиса, не localhost
      DATABASE_URL: postgresql://imagetransformer:${POSTGRES_PASSWORD}@postgre_imagetransformer/imagetransformer
    expose:
      - "8080"
    depends_on:
      - postgre_imagetransformer
    volumes:
      - uploads_data:/app/uploads
    networks:
      - imagetransformer_net
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.imagetransformation.rule=Host(`imagetransformation.ru`)"
      - "traefik.http.routers.imagetransformation.entrypoints=websecure"
      - "traefik.http.routers.imagetransformation.tls=true"
      - "traefik.http.routers.imagetransformation.tls.certresolver=mytlschallenge"
      - "traefik.http.services.imagetransformation.loadbalancer.server.port=8080"

volumes:
  postgres_data:
  uploads_data:

networks:
  imagetransformer_net:
  n8n_default:
    external: true
